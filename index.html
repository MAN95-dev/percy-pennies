<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Percy Pennies</title>
  <meta name="description" content="Track monthly spending and see what's going up or down. Data stays on your phone.">
  <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#151413" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Pennies">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="month">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>Month</span>
    </button>
    <button data-tab="trends">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>
      <span>Compare</span>
    </button>
    <button data-tab="year">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5V12l6 4"/></svg>
      <span>Year</span>
    </button>
    <button data-tab="more">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
      <span>More</span>
    </button>
  </nav>

  <button class="fab" data-act="add" aria-label="Add an expense">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="sheet" class="sheet-wrap" hidden>
    <div class="backdrop" data-act="close"></div>
    <div class="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>

  <noscript><p style="padding:20px">This app needs JavaScript turned on.</p></noscript>
  <script src="js/app.js"></script>
</body>
</html>
